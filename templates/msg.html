<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>留言板 - Hiter的个人笔记</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://artalk.iamyyy.top/dist/Artalk.css">
  <script src="https://artalk.iamyyy.top/dist/Artalk.js"></script>

  <style>
    html,body{margin:0;height:100%;background:#fff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:#333;display:flex;flex-direction:column}
    h1{text-align:center;font-size:28px;margin:40px 0 30px;letter-spacing:1px}
    .back{margin-top:auto;padding:20px 0;text-align:center}
    .btn-close{position:fixed;top:20px;right:20px;padding:8px 16px;background:#f5f5f5;border:0;border-radius:4px;font-size:14px;color:#333;cursor:pointer}
    .btn-close:hover{background:#e5e5e5}
    @media(max-width:600px){h1{font-size:24px;margin:30px 0 20px}}
  </style>
</head>

<body>
  <button class="btn-close" onclick="window.close()">关闭页面</button>
  <h1>💖 留言板</h1>
  <div id="Comments"></div>
  <div class="back">
    <button class="btn-close" onclick="window.close()">关闭页面</button>
  </div>

  <script>
    Artalk.init({
      el: '#Comments',
      pageKey: '/msg',
      pageTitle: '留言板',
      server: 'https://artalk.iamyyy.top',
      site: 'Hiter的博客',
      locale: 'zh-CN',
      emoticons: 'https://cdn.jsdelivr.net/gh/ArtalkJS/Emoticons/grps/default.json'
    });
